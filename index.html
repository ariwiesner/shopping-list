<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Basket" />
  <title>Basket</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <div>
          <p class="greeting" id="greeting">Hello!</p>
          <h1>My Basket</h1>
        </div>
        <button class="icon-btn" id="menuBtn" aria-label="More options" aria-haspopup="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
      </div>

      <div class="progress-card" id="progressCard">
        <div class="progress-text">
          <span id="progressLabel">Nothing on the list yet</span>
          <span class="progress-count" id="progressCount"></span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </header>

    <main class="content" id="content">
      <section id="emptyState" class="empty" hidden>
        <div class="empty-art" aria-hidden="true">🧺</div>
        <h2>Your basket is empty</h2>
        <p>Add something below, or tap a suggestion to get started.</p>
        <div class="chips" id="suggestions"></div>
      </section>

      <section id="todoSection">
        <ul class="list" id="todoList"></ul>
      </section>

      <section id="doneSection" hidden>
        <button class="section-head" id="doneToggle" aria-expanded="true">
          <span>In the cart <span class="pill" id="doneCount">0</span></span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <ul class="list done" id="doneList"></ul>
      </section>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-inner">
        <input id="itemInput" type="text" inputmode="text" enterkeyhint="done"
               placeholder="Add an item… e.g. 2 milk" aria-label="Item name" maxlength="60" />
        <button type="submit" class="add-btn" aria-label="Add item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </form>
  </div>

  <!-- Options sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <h3 id="sheetTitle">List options</h3>
    <button class="sheet-item" data-action="uncheck-all">↩️ <span>Move everything back to the list</span></button>
    <button class="sheet-item" data-action="clear-done">🧹 <span>Remove items in the cart</span></button>
    <button class="sheet-item danger" data-action="clear-all">🗑️ <span>Start a new list</span></button>
    <button class="sheet-item cancel" data-action="close">Cancel</button>
  </div>

  <!-- Edit sheet -->
  <div class="sheet" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="editTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <h3 id="editTitle">Edit item</h3>
    <form id="editForm" class="edit-form">
      <label class="field">
        <span>Name</span>
        <input id="editName" type="text" maxlength="60" required />
      </label>
      <div class="field">
        <span>Quantity</span>
        <div class="stepper big">
          <button type="button" data-step="-1" aria-label="Decrease">−</button>
          <output id="editQty">1</output>
          <button type="button" data-step="1" aria-label="Increase">+</button>
        </div>
      </div>
      <div class="edit-actions">
        <button type="button" class="btn ghost danger" id="editDelete">Delete</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button id="toastUndo">Undo</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
